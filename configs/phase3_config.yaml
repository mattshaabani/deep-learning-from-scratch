dataset:
  source: "shakespeare"
  source_url: "https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt"
  train_split: 0.9
  random_state: 42

sequence:
  seq_lengths_to_test: [20, 50, 100, 200]
  default_seq_length: 100
  batch_size: 32

model:
  hidden_size: 128
  embedding_size: 64

training:
  epochs: 10
  learning_rate: 0.003
  optimizer: "adam"
  gradient_clip_norm: 5.0

generation:
  temperature: 0.8
  generate_length: 300