dataset:
  source: "shakespeare"   # reuse Phase 3's corpus for direct comparison
  seq_length: 128
  batch_size: 32

model:
  d_model: 128
  num_heads: 4
  num_layers: 4
  d_ff: 512              # feedforward hidden dimension
  dropout: 0.1
  max_seq_length: 256

scaling_study:
  model_sizes:
    small:  {d_model: 64,  num_heads: 2, num_layers: 2}
    medium: {d_model: 128, num_heads: 4, num_layers: 4}
    large:  {d_model: 256, num_heads: 8, num_layers: 6}

training:
  epochs: 15
  learning_rate: 0.0003
  optimizer: "adam"
  gradient_clip_norm: 1.0
  warmup_steps: 100

generation:
  temperature: 0.8
  generate_length: 300